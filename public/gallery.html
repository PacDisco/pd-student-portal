<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Photos · Pacific Discovery Student Portal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f8f8f8;
      color: #212121;
    }
    header {
      position: relative;
      padding: 22px 24px;
      background: #55BBD2;
      color: white;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
    header .who {
      margin-left: auto;
      font-size: 12px;
      letter-spacing: 0.6px;
      opacity: 0.85;
    }
    header a.nav, header button.logout {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 1.2px;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }
    header a.nav:hover, header button.logout:hover { background: rgba(255,255,255,0.12); }
    header .nav-row { display: flex; gap: 8px; align-items: center; margin-left: 16px; }

    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }

    .intro {
      color: #666;
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 22px;
    }
    .empty, .loading, .error {
      color: #999;
      font-size: 13px;
      letter-spacing: 0.4px;
      padding: 40px 0;
      text-align: center;
    }
    .error { color: #c0392b; }

    /* Trip-picker cards (when user has multiple portals) */
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }
    .portal-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-top: 4px solid #59a1aa;
      padding: 18px 20px 20px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: block;
    }
    .portal-card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,0.06); }
    .portal-card-title { font-size: 14px; font-weight: 600; margin: 0 0 6px; letter-spacing: 0.3px; line-height: 1.3; }
    .portal-card-destination { font-size: 12px; color: #666; margin: 0 0 10px; }
    .portal-card-cta { margin-top: 14px; font-size: 11px; letter-spacing: 1.5px; font-weight: 600; color: #55BBD2; }

    /* Album shell */
    .gallery-shell {
      background: white;
      border: 1px solid #e5e7eb;
      border-top: 4px solid #59a1aa;
      padding: 18px;
    }
    .gallery-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; margin-bottom: 16px; }
    .gallery-meta h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.4px; }
    .gallery-meta .sub { font-size: 12px; color: #666; }
    .gallery-meta .pill { margin-left: auto; font-size: 11px; letter-spacing: 0.6px; color: #59a1aa; white-space: nowrap; }

    .album-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
    .btn-open {
      display: inline-block;
      background: #55BBD2;
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 1.2px;
      font-weight: 600;
      padding: 10px 18px;
      border: 0;
      transition: background 0.2s ease;
    }
    .btn-open:hover { background: #3fa8c0; }
    .album-note { font-size: 12px; color: #777; line-height: 1.5; }

    /* Photo grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }
    .photo-cell {
      position: relative;
      padding-top: 100%;
      background: #eef1f3;
      overflow: hidden;
      cursor: zoom-in;
      border: 0;
      padding-left: 0;
      padding-right: 0;
      padding-bottom: 0;
      display: block;
      width: 100%;
    }
    .photo-cell img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .photo-cell img.is-loaded { opacity: 1; }
    .photo-cell:hover img.is-loaded { transform: scale(1.04); }
    .photo-cell:focus-visible { outline: 3px solid #55BBD2; outline-offset: 2px; }

    /* Lightbox */
    .lb {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.94);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .lb.is-open { display: flex; }
    .lb img {
      max-width: 92vw;
      max-height: 84vh;
      object-fit: contain;
      display: block;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .lb-btn {
      position: absolute;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.28);
      color: #fff;
      font-family: inherit;
      font-size: 22px;
      line-height: 1;
      width: 46px;
      height: 46px;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-btn:hover { background: rgba(255,255,255,0.22); }
    .lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
    .lb-close { right: 16px; top: 16px; font-size: 18px; }
    .lb-count {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.75);
      font-size: 12px;
      letter-spacing: 1.2px;
    }

    .switch-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 1.2px;
      color: #55BBD2;
      text-decoration: none;
      font-weight: 500;
    }
    .switch-link:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      header { flex-wrap: wrap; }
      header .nav-row { margin-left: 0; width: 100%; justify-content: space-between; }
      header .who { width: 100%; margin-left: 0; margin-top: 4px; opacity: 0.7; }
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
    }
  </style>
</head>
<body>
<header>
  <h1>TRIP PHOTOS</h1>
  <div class="nav-row">
    <a class="nav" href="/index.html">PORTAL</a>
    <a class="nav" id="switchTripLink" href="/my-trips.html" style="display:none;">SWITCH TRIP</a>
    <button class="logout" type="button" onclick="logout()">LOG OUT</button>
  </div>
  <div class="who" id="whoami"></div>
</header>
<main>
  <div id="content" class="loading">LOADING PHOTOS…</div>
</main>

<!-- Lightbox lives outside #content so re-renders don't clobber it -->
<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-btn lb-close" type="button" id="lbClose" aria-label="Close">&#10005;</button>
  <button class="lb-btn lb-prev" type="button" id="lbPrev" aria-label="Previous photo">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="lb-btn lb-next" type="button" id="lbNext" aria-label="Next photo">&#8250;</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
  /* --- session: attach Bearer token to all function calls; 401 -> login --- */
  (function(){
    var _f = window.fetch;
    window.fetch = function(input, init){
      init = init || {};
      try {
        var u = typeof input === "string" ? input : (input && input.url) || "";
        if (u.indexOf("/.netlify/functions/") !== -1) {
          var t = sessionStorage.getItem("portalToken");
          if (t) {
            var h = new Headers(init.headers || (typeof input !== "string" && input.headers) || {});
            if (!h.has("Authorization")) h.set("Authorization", "Bearer " + t);
            init = Object.assign({}, init, { headers: h });
          }
        }
      } catch (e) {}
      return _f.call(this, input, init).then(function(res){
        try {
          if (res && res.status === 401 && location.pathname.indexOf("login") === -1) {
            sessionStorage.clear();
            location.href = "/login.html";
          }
        } catch (e) {}
        return res;
      });
    };
  })();

  const email = sessionStorage.getItem("portalEmail");
  const firstName = sessionStorage.getItem("firstName") || "";
  const selectedPortalId = sessionStorage.getItem("selectedPortalId") || "";

  // Auth gate (matches my-trips.html / index.html pattern). We deliberately
  // don't bounce admins out — they can view the family-facing album too,
  // useful for testing and parent-support calls.
  if (!email) {
    window.location.href = "/login.html";
  }

  document.getElementById("whoami").textContent =
    [firstName, email].filter(Boolean).join(" · ");

  async function logout() {
    const t = sessionStorage.getItem("portalToken");
    try { if (t) await fetch("/.netlify/functions/logout", { method: "POST", headers: { Authorization: "Bearer " + t }, keepalive: true }); } catch (_) {}
    sessionStorage.removeItem("portalToken");
    sessionStorage.removeItem("portalEmail");
    sessionStorage.removeItem("adminRole");
    sessionStorage.removeItem("firstName");
    sessionStorage.removeItem("selectedPortalId");
    window.location.href = "/login.html";
  }

  function attrEsc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
      .replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function pickPortal(id) {
    try { sessionStorage.setItem("selectedPortalId", String(id)); } catch (_) {}
    location.search = "";
    location.reload();
  }

  // Multi-trip picker — same look as my-trips.html
  function renderPicker(portals) {
    const c = document.getElementById("content");
    c.className = "";
    c.innerHTML = `
      <p class="intro">Pick a trip to view its photos.</p>
      <div class="portal-grid">${portals.map(p => `
        <a class="portal-card" href="javascript:void(0);" onclick="pickPortal('${attrEsc(p.id)}')">
          <h3 class="portal-card-title">${attrEsc(p.title || "(untitled)")}</h3>
          ${p.destination ? `<div class="portal-card-destination">${attrEsc(p.destination)}</div>` : ""}
          <div class="portal-card-cta">VIEW PHOTOS &rsaquo;</div>
        </a>
      `).join("")}</div>
    `;
  }

  function renderError(msg, hint) {
    const c = document.getElementById("content");
    c.className = "error";
    c.innerHTML = `<div>${attrEsc(msg)}</div>${hint ? `<div style="color:#666;font-size:12px;margin-top:8px;">${attrEsc(hint)}</div>` : ""}`;
  }

  function renderEmpty(msg, data) {
    const c = document.getElementById("content");
    c.className = "empty";
    c.textContent = msg;

    // Staff-only diagnostic. Families just see the friendly message above;
    // an admin also gets which Portal record was read and which property was
    // checked, so "no album" can be told apart from "pasted on the wrong
    // record" or "property misnamed" without opening the network tab.
    const isAdmin = !!sessionStorage.getItem("adminRole");
    if (isAdmin && data && data.portal_id) {
      const d = document.createElement("div");
      d.style.cssText = "margin-top:18px;font-size:11px;color:#aaa;letter-spacing:0.3px;line-height:1.7;";
      const exists = data.property_exists === false ? "missing"
                   : data.property_exists === true ? "exists"
                   : "unknown";
      d.innerHTML =
        `<strong style="color:#999;">ADMIN DIAGNOSTIC</strong><br>` +
        `Read Portal record <a href="${attrEsc(data.portal_url || "#")}" target="_blank" rel="noopener" style="color:#55BBD2;">${attrEsc(data.portal_id)}</a><br>` +
        `Property <code>${attrEsc(data.property_checked || "photo_album_link")}</code> — ${exists}, value empty`;
      c.appendChild(d);
    }
  }

  // -------------------------------------------------------------------------
  // Lightbox
  // -------------------------------------------------------------------------
  let PHOTOS = [];
  let lbIndex = 0;
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbCount = document.getElementById("lbCount");

  // Google's lh3 CDN takes size directives on the base URL. `-w` caps width,
  // `-c` crops to the box. Asking for exactly what we render keeps the grid
  // light on mobile data — full-size trip photos are often 4-8MB each.
  function sized(url, spec) { return url + "=" + spec; }

  function openLightbox(i) {
    if (!PHOTOS.length) return;
    lbIndex = (i + PHOTOS.length) % PHOTOS.length;
    const p = PHOTOS[lbIndex];
    lbImg.src = sized(p.url, "w2048");
    lbImg.alt = `Trip photo ${lbIndex + 1} of ${PHOTOS.length}`;
    lbCount.textContent = `${lbIndex + 1} / ${PHOTOS.length}`;
    lb.classList.add("is-open");
    document.body.style.overflow = "hidden";
    // Warm the neighbours so arrowing through feels instant.
    [lbIndex + 1, lbIndex - 1].forEach(n => {
      const q = PHOTOS[(n + PHOTOS.length) % PHOTOS.length];
      if (q) { const im = new Image(); im.src = sized(q.url, "w2048"); }
    });
  }

  function closeLightbox() {
    lb.classList.remove("is-open");
    lbImg.removeAttribute("src");
    document.body.style.overflow = "";
  }

  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  document.getElementById("lbPrev").addEventListener("click", () => openLightbox(lbIndex - 1));
  document.getElementById("lbNext").addEventListener("click", () => openLightbox(lbIndex + 1));
  lb.addEventListener("click", (e) => { if (e.target === lb) closeLightbox(); });
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("is-open")) return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowRight") openLightbox(lbIndex + 1);
    else if (e.key === "ArrowLeft") openLightbox(lbIndex - 1);
  });

  // -------------------------------------------------------------------------
  // Album render
  // -------------------------------------------------------------------------
  function renderAlbum(payload) {
    const c = document.getElementById("content");
    c.className = "";
    PHOTOS = Array.isArray(payload.photos) ? payload.photos : [];

    const trip = payload.trip || {};
    const tripLine = [
      trip.season && trip.year ? `${trip.season} ${trip.year}` : null,
      trip.destination,
    ].filter(Boolean).join(" · ");
    const heading =
      payload.title || trip.portal_title || trip.program_name || trip.destination || "Trip photos";
    const count = PHOTOS.length;

    const grid = count
      ? `<div class="photo-grid">${PHOTOS.map((p, i) => `
          <button class="photo-cell" type="button" data-i="${i}" aria-label="Open photo ${i + 1}">
            <img src="${attrEsc(sized(p.url, "w500-h500-c"))}"
                 alt="Trip photo ${i + 1}"
                 loading="lazy" decoding="async"
                 onload="this.classList.add('is-loaded')"
                 onerror="this.closest('.photo-cell').style.display='none'">
          </button>`).join("")}</div>`
      : `<p class="album-note">${attrEsc(payload.hint || "No photos in this album yet — check back soon.")}</p>`;

    c.innerHTML = `
      <div class="gallery-shell">
        <div class="gallery-meta">
          <h2>${attrEsc(heading)}</h2>
          <span class="sub">${attrEsc(tripLine)}</span>
          <span class="pill">${count} PHOTO${count !== 1 ? "S" : ""}</span>
        </div>
        <div class="album-actions">
          <a class="btn-open" href="${attrEsc(payload.album_url)}" target="_blank" rel="noopener noreferrer">
            OPEN IN GOOGLE PHOTOS
          </a>
          <span class="album-note">Open the album to download full-resolution copies or add your own photos.</span>
        </div>
        ${grid}
      </div>
      <a class="switch-link" href="/my-trips.html">&lsaquo; SWITCH TRIP</a>
    `;

    c.querySelectorAll(".photo-cell").forEach(cell => {
      cell.addEventListener("click", () => openLightbox(Number(cell.dataset.i)));
    });
  }

  // -------------------------------------------------------------------------
  // Load
  // -------------------------------------------------------------------------
  function handlePayload(res, data) {
    if (!res.ok) {
      if (res.status === 403) {
        renderError("You don't have access to this trip's photos.");
      } else if (res.status === 404) {
        renderEmpty(data.hint || data.error || "No photos available for this trip yet.", data);
      } else {
        renderError(data.error || ("HTTP " + res.status), data.hint);
      }
      return;
    }
    if (data.requirePicker && Array.isArray(data.portals)) {
      renderPicker(data.portals);
      return;
    }
    renderAlbum(data);
  }

  async function loadForPortal(picked) {
    const url = `/.netlify/functions/get-photo-album?picked=${encodeURIComponent(picked)}`;
    const res = await fetch(url);
    const data = await res.json();
    handlePayload(res, data);
  }

  async function init() {
    try {
      // If we already have a selectedPortalId from /my-trips.html, use it.
      if (selectedPortalId) {
        document.getElementById("switchTripLink").style.display = "";
        await loadForPortal(selectedPortalId);
        return;
      }
      // Otherwise let the endpoint figure it out — it handles single,
      // multi-trip picker, and unauthorized cases in one call.
      const res = await fetch("/.netlify/functions/get-photo-album");
      const data = await res.json();
      handlePayload(res, data);
    } catch (err) {
      renderError("Network error: " + (err.message || String(err)));
    }
  }
  init();
</script>
</body>
</html>
